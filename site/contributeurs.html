<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>Éclaireurs</title>
  <meta name="description" content="Partez repérer une destination pour nos clients. Vol et hébergement payés, plus 1 000 $ par mission.">
  <link rel="icon" href="../icons/demande.svg" type="image/svg+xml">
  <link rel="preload" href="../fonts/figtree.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="../css/site.css">
</head>
<body class="page-contrib">
  <header class="nav">
    <div class="enveloppe nav-int">
      <a class="marque" href="./"><span class="marque-ico" data-ico="compass"></span><span data-marque></span></a>
      <nav class="nav-liens">
        <a href="#comment" data-t="navComment"></a>
        <a href="#gains" data-t="navGains"></a>
        <a href="#qualite" data-t="navQualite"></a>
        <a href="#faq" data-t="navFaq"></a>
      </nav>
      <div class="nav-droite">
        <div class="langue" role="group" aria-label="Langue / Language"><button data-langue="fr">FR</button><button data-langue="en">EN</button></div>
        <a class="bouton petit" href="#inscription"><span class="long" data-t="cta"></span><span class="court" data-t="ctaCourt"></span></a>
      </div>
    </div>
  </header>

  <main id="haut">
    <section class="couverture">
      <div class="fond-couverture" id="fond-couverture" aria-hidden="true"></div>
      <div class="enveloppe couv-int">
        <p class="surtitre" data-t="surtitre"></p>
        <h1 data-t="titre"></h1>
        <p class="sous-titre" data-t="sousTitre"></p>
        <div class="boutons">
          <a class="bouton grand" href="#inscription"><span data-t="cta"></span><span data-ico="arrow-right"></span></a>
          <a class="bouton grand clair" href="#comment" data-t="voirComment"></a>
        </div>
      </div>
    </section>

    <section class="bande-chiffres">
      <div class="enveloppe chiffres-int" id="chiffres"></div>
    </section>

    <section class="section" id="comment">
      <div class="enveloppe">
        <p class="surtitre" data-t="commentSur"></p>
        <h2 data-t="commentTitre"></h2>
        <ol class="etapes etapes-4">
          <li><span class="num">1</span><span data-ico="user-plus"></span><h3 data-t="e1t"></h3><p data-t="e1p"></p></li>
          <li><span class="num">2</span><span data-ico="camera"></span><h3 data-t="e2t"></h3><p data-t="e2p"></p></li>
          <li><span class="num">3</span><span data-ico="shield-check"></span><h3 data-t="e3t"></h3><p data-t="e3p"></p></li>
          <li><span class="num">4</span><span data-ico="banknote"></span><h3 data-t="e4t"></h3><p data-t="e4p"></p></li>
        </ol>
      </div>
    </section>

    <section class="section douce" id="gains">
      <div class="enveloppe">
        <p class="surtitre" data-t="gainsSur"></p>
        <h2 data-t="gainsTitre"></h2>
        <p class="texte" data-t="gainsTexte"></p>
        <div class="gains" id="gains-liste"></div>
      </div>
    </section>

    <section class="section" id="cherche">
      <div class="enveloppe deux-col">
        <div>
          <p class="surtitre" data-t="chercheSur"></p>
          <h2 data-t="chercheTitre"></h2>
          <p class="texte" data-t="chercheTexte"></p>
        </div>
        <ul class="liste-recois" id="categories"></ul>
      </div>
    </section>

    <section class="section sombre" id="qualite">
      <div class="enveloppe deux-col">
        <div>
          <p class="surtitre" data-t="qualiteSur"></p>
          <h2 data-t="qualiteTitre"></h2>
          <p class="texte" data-t="qualiteTexte"></p>
        </div>
        <ul class="regles-qualite" id="regles-qualite"></ul>
      </div>
    </section>

    <section class="section douce" id="inscription">
      <div class="enveloppe inscription">
        <div class="inscription-texte">
          <p class="surtitre" data-t="inscSur"></p>
          <h2 data-t="inscTitre"></h2>
          <p class="texte" data-t="inscTexte"></p>
          <ul class="rassure-liste" id="rassure-insc"></ul>
        </div>
        <form class="carte-form" id="form-insc" novalidate></form>
      </div>
    </section>

    <section class="section" id="faq">
      <div class="enveloppe etroit">
        <p class="surtitre" data-t="faqSur"></p>
        <h2 data-t="faqTitre"></h2>
        <div class="faq" id="faq-liste"></div>
      </div>
    </section>
  </main>

  <footer class="pied">
    <div class="enveloppe pied-int">
      <span class="marque"><span class="marque-ico" data-ico="compass"></span><span data-marque></span></span>
      <span><a href="./" data-t="lienVoyageurs"></a> · <a href="https://unsplash.com" target="_blank" rel="noopener" data-t="credits"></a></span>
    </div>
  </footer>
  <div id="toast" role="status"></div>
  <script type="module" src="../js/site-contrib.js"></script>
</body>
</html>
