<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>Demande de voyage · Voyage sur mesure</title>
  <meta name="description" content="Parlez-nous de votre projet de voyage. Nous vous répondons sous 12 heures avec une première proposition d’itinéraire.">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Voyage sur mesure">
  <meta property="og:title" content="Demande de voyage sur mesure">
  <meta property="og:description" content="Quelques questions sur votre projet. Nous vous répondons sous 12 heures avec une première proposition d’itinéraire.">
  <meta property="og:image" content="https://raphaelstlaurent67-svg.github.io/Appli-voyage/icons/apercu-demande.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:url" content="https://raphaelstlaurent67-svg.github.io/Appli-voyage/demande.html">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex">
  <link rel="icon" href="icons/demande.svg" type="image/svg+xml">
  <link rel="manifest" href="demande.webmanifest">
  <link rel="apple-touch-icon" href="icons/demande-192.png">
  <link rel="preload" href="fonts/newsreader.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="css/demande.css">
  <script>
    // Arrivée depuis le site : la fiche apparaît en douceur (et sur la photo du pays touché, s'il y en a une).
    try {
      var a = JSON.parse(sessionStorage.getItem('arriveeSite') || 'null');
      sessionStorage.removeItem('arriveeSite');
      if (a && Date.now() - a.quand < 6000 && !matchMedia('(prefers-reduced-motion: reduce)').matches) {
        var h = document.documentElement;
        h.classList.add('arrivee');
        if (/^https:\/\/images\.unsplash\.com\//.test(a.photo || '')) { h.classList.add('arrivee-photo'); h.style.setProperty('--photo-arrivee', 'url("' + a.photo + '")'); }
      }
    } catch (e) {}
  </script>
</head>
<body>
  <div class="decor" id="decor" aria-hidden="true"><div class="decor-img"></div><div class="decor-img"></div></div>
  <main class="fiche" id="fiche"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="js/demande.js"></script>
</body>
</html>
